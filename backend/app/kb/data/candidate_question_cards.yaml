    text: "İTÜ Bilgisayar 2025'te 533,14 puan ve yaklaşık 1.435 SAY sırasıyla kapattı; 2024 yaklaşık 1.348, 2023 yaklaşık 1.147 idi. Gelecek taban sıra kontenjan ve talebe göre oluşur; garanti edilemez."
