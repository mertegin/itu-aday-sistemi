  - id: "erasmus_course_recognition_card"
    text: "Erasmus dersleri otomatik sayılmaz: 2 temel belge, OLA ve Tanınma Belgesi, bölüm/Erasmus koordinatörü onayıyla hazırlanır. Dönüşte karşı kurum transkripti gerekir; ders adı ve AKTS uyuşmazsa İTÜ transkriptine FF işlenebilir."
    answer_card: true
