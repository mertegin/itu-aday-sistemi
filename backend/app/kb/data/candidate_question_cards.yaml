  - id: "teaching_quality_honesty_card"
    text: "Bizim bölümümüzde 37 öğretim üyesi, 10 tam zamanlı öğretim görevlisi ve 18 laboratuvar var; her öğrenciye danışman atanıyor. 2026 öğrenci deneyiminde hocalarımızın İngilizcesi ve ders anlatımı genel olarak güçlü, iletişimleri erişilebilir değerlendiriliyor."
    answer_card: true
    topics: ["teaching_quality", "faculty", "student_wellbeing"]
    examples: ["37 öğretim üyesi", "18 laboratuvar", "danışman"]
    source: "İTÜ BBF resmî sayfası + öğrenci geri bildirimi"
    source_url: "https://bbf.itu.edu.tr/ogrenciler/aday-ogrenciler"
    tags: ["anlaşılır anlat", "hocaların ingilizcesi", "ders anlatımı", "ilgileniyor mu", "kalabalık sınıf"]

  - id: "lab_access_honesty_card"
    text: "Fakültemizde 18 araştırma laboratuvarı var. Lisans öğrencisi LÖKAP'a veya ilgili hocanın projesine katılıp hocayla görüşerek laboratuvarda çalışabiliyor; erişim otomatik değil, izin ve proje uyumu gerekiyor. Robotik Lab ekibinde 5 lisans öğrencisi örneği var."
    answer_card: true
    topics: ["technical_resources", "labs", "research_projects"]
