  - id: "admission_preference_strategy_card"
    text: "Tercih sırası istek sırasıdır: üstteki tercih tutmazsa alttaki yanmaz. İTÜ Bilgisayar'ın 2025 tabanı yaklaşık 1.435'ti; adayın kendi SAY sırası bilinmeden 'kesin gelir' denemez, hedef-risk-güvenli seçenekler birlikte yazılmalıdır."
    answer_card: true
    topics: ["ranking", "admission"]
