  - id: "admission_itu_ai_data_2025_direct"
    label: "İTÜ Yapay Zekâ ve Veri 2025 kabul gerçekliği"
    text: "İTÜ Yapay Zekâ ve Veri Mühendisliği 2025'te 1.947 en düşük, 102 en yüksek ve 1.438 ortalama SAY başarı sırasıyla öğrenci aldı; genel kontenjanı 30'du. 2.000 ve üzerindeki bir sıra, geçen yılın 1.947 tabanının gerisindedir ve garanti gibi anlatılamaz."
    answer_card: true
    source: "İTÜ TYÇÇ Yapay Zekâ ve Veri Mühendisliği program sayfası"
    source_url: "https://www.tyyc.itu.edu.tr/ProgramHakkinda.php?Program=YZV_LS"
