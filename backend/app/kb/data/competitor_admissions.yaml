    tags: ["yapay zeka", "veri mühendisliği", "1947", "1.947", "2000"]

  - id: "admission_koc_compe_full_2025_direct"
    label: "Koç Bilgisayar %100 burslu 2025 kabul gerçekliği"
    text: "Koç Bilgisayar Mühendisliği %100 burslu genel kontenjanı 2025'te 18, taban SAY başarı sırası 113'tü. Örneğin 435 sıralama, geçen yılın %100 burslu tabanının gerisindedir; ücretli veya %50 indirimli kontenjanlar ayrı değerlendirilmelidir."
    answer_card: true
