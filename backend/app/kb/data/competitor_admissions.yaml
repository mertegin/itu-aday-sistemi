    label: "YTÜ Bilgisayar 2025 kabul gerçekliği"
    text: "YTÜ Bilgisayar Mühendisliği 2025'te 7.395 SAY başarı sırasıyla kapattı; genel kontenjanı 100'dü. Bu sayı yalnız kabul erişilebilirliğini gösterir, eğitim ve kampüs kalitesinin tek başına ölçüsü değildir."
