  - id: "admission_itu_compe_2025_direct"
    label: "İTÜ Bilgisayar 2025 kabul gerçekliği"
    text: "İTÜ Bilgisayar Mühendisliği 2025'te 1.435 en düşük, 19 en yüksek ve 733 ortalama SAY başarı sırasıyla öğrenci aldı. Aday 1.435'in gerisindeyse geçen yılın tabanına göre bölüm gelmiyordu; yeni yıl için yine de kesin sonuç söylenemez."
    answer_card: true
    source: "İTÜ TYÇÇ Bilgisayar Mühendisliği program sayfası"
