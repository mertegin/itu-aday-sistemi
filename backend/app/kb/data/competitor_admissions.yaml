  - id: "admission_itu_alternatives_2025_direct"
    label: "İTÜ içinde sıralamaya göre gerçekçi alternatifler"
    text: "2025 tabanları İTÜ Elektronik-Haberleşme için 2.126, Uçak için 2.235, Matematik Mühendisliği için 3.495, Endüstri için 3.723 ve Kontrol-Otomasyon için 4.486 idi. Bilgisayar gerçekçi değilse adayın ilgisine uyan İTÜ alternatifi bu tabanlarla dürüstçe eşleştirilmelidir."
