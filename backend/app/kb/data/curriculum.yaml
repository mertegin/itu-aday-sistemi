    text: "Dersleri düzenli takip etmek güçlü bir başlangıç, fakat bizim teknik derslerde tek başına dinlemek genelde yetmez. BLG 102E ve BLG 223E kod pratiği, BLG 312E 3 programlama ödevi, BLG 335E ise 3 proje içeriyor; haftalık kod yazıp problem çözmek yükün sınav haftasına birikmesini önler."
