    text: "İTÜ Bilgisayar yalnız yazılım değildir: zorunlu planda Veri Yapıları ve Algoritmalar kadar Sayısal Devreler, Elektronik, Mikroişlemci, Bilgisayar Mimarisi ve İşletim Sistemleri de var. Bu geniş temel, yazılım-AI-sistem-gömülü yolları arasında seçim esnekliği sağlar."
    answer_card: true
