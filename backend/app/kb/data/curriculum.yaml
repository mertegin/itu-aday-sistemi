facts:
  - id: "curriculum_year1_card"
    text: "1. yarıyıl: Fizik I+Lab, Bilgi Sistemlerine Giriş, Bilgisayar Mühendisliğine Giriş ve Etik, Matematik I, Lineer Cebir, ING 100. 2. yarıyıl: Ayrık Matematik, C ile Programlamaya Giriş, Matematik II, Fizik II+Lab, ING 112A, DAN 102."
    answer_card: true
    topics: ["curriculum_year1"]
    examples: ["Bilgi Sistemlerine Giriş", "Bilgisayar Mühendisliğine Giriş ve Etik", "Ayrık Matematik", "C Programlama"]
    tags: ["ilk sınıf", "birinci sınıf", "ilk yıl", "1. yarıyıl", "2. yarıyıl"]

  - id: "curriculum_semester1_codes"
    text: "Güncel 1. yarıyıl kodları: FIZ 101E, FIZ 101EL, BBF 101E, BLG 113E, MAT 103E, BBF 102E ve ING 100. Toplam 30 AKTS'dir."
    topics: ["curriculum_year1"]
    examples: ["BBF 101E", "BLG 113E", "MAT 103E", "30 AKTS"]
    tags: ["birinci dönem", "1. dönem", "ders kodu", "kaç akts"]

  - id: "curriculum_semester2_codes"
    text: "Güncel 2. yarıyıl kodları: BBF 103E, BLG 102E, MAT 104E, FIZ 102E, FIZ 102EL, ING 112A ve DAN 102. Toplam 30 AKTS'dir."
    topics: ["curriculum_year1"]
    examples: ["BBF 103E", "BLG 102E", "MAT 104E", "30 AKTS"]
    tags: ["ikinci dönem", "2. dönem", "ders kodu", "kaç akts"]

  - id: "curriculum_beginner_programming_card"
    text: "Kod bilmeden başlanabilir: BLG 102E ikinci yarıyılda C ile algoritma, değişken, döngü, fonksiyon, dizi ve işaretçileri temelden öğretir; resmî amacı öğrencileri programlamaya başlatmaktır. Ders 8 AKTS ve haftada 3+2 saattir."
    answer_card: true
    topics: ["curriculum_beginner", "programming_languages"]
    examples: ["C", "algoritma", "fonksiyon", "dizi", "işaretçi"]
    source: "İTÜ ÖBS BLG 102E ders kataloğu"
    source_url: "https://obs.itu.edu.tr/public/DersKatalog/DersKatalogBilgiBransDersKodu?bransKodu=BLG&dersNo=102"
    tags: ["hiç programlama yapmadım", "kod bilmiyorum", "başlangıç", "hangi dil"]

  - id: "curriculum_overview_card"
    text: "Program C ve matematik temelinden veri yapıları, devreler, algoritmalar, veritabanı, mikroişlemci, mimari, işletim sistemi, yapay zekâ ve yazılım mühendisliğine ilerler; 8 yarıyıl, 130 yerel kredi ve 240 AKTS iki dönemlik tasarımla tamamlanır."
    answer_card: true
    topics: ["curriculum_overview", "graduation"]
    examples: ["işletim sistemi", "yapay zekâ", "iki dönemlik tasarım", "240 AKTS"]
    tags: ["ne öğretiliyor", "bölümde ne öğrenilir", "tam olarak", "genel müfredat"]

  - id: "curriculum_semester3"
    text: "3. yarıyıl: Olasılık ve İstatistik, Veri Yapıları, Sayısal Devreler, Elektroniğe Giriş, ING 201A ve ATA 121. BLG 223E; liste, ağaç, yığın, kuyruk, özyineleme ve dinamik belleği C/C++ ile işler."
    topics: ["curriculum_year2", "programming_languages", "academic_workload"]
    examples: ["Veri Yapıları", "C/C++", "Sayısal Devreler"]
    source_urls:
      - "https://obs.itu.edu.tr/public/DersPlan/DersPlanDetay/2340"
      - "https://obs.itu.edu.tr/public/DersKatalog/DersKatalogBilgiBransDersKodu?bransKodu=BLG&dersNo=223"
    tags: ["3. yarıyıl", "ikinci sınıf", "veri yapıları", "c++"]

  - id: "curriculum_semester4"
    text: "4. yarıyıl: Sayısal Yöntemler, Nesne Yönelimli Programlama, Biçimsel Diller ve Otomata, Bilgisayar Organizasyonu, Mantık Devreleri Laboratuvarı, TUR 121 ve bir TM seçmeli; toplam 30 AKTS."
    topics: ["curriculum_year2", "curriculum_systems", "academic_workload"]
    examples: ["Nesne Yönelimli Programlama", "Bilgisayar Organizasyonu", "Mantık Devreleri Laboratuvarı"]
    tags: ["4. yarıyıl", "ikinci sınıf", "teorik ders", "uygulama"]

  - id: "curriculum_semester5"
    text: "5. yarıyıl: Algoritmaların Analizi I, Veritabanı Sistemleri, Mikroişlemci Sistemleri, Mikrobilgisayar Laboratuvarı, Elektroniğe Giriş Laboratuvarı, TUR 122, bir İTÜ ve bir TM seçmeli; toplam 30 AKTS."
    topics: ["curriculum_year3", "curriculum_systems", "technical_resources"]
    examples: ["Algoritmaların Analizi I", "Veritabanı Sistemleri", "Mikrobilgisayar Laboratuvarı"]
    tags: ["5. yarıyıl", "üçüncü sınıf", "laboratuvar"]

  - id: "curriculum_semester6"
    text: "6. yarıyıl: Algoritmaların Analizi II, Veriden Öğrenme, İşletim Sistemleri, Bilgisayar Mimarisi, Bilgisayar Mühendisleri için İşaret ve Sistemler ve bir TM seçmeli; toplam 30 AKTS."
    topics: ["curriculum_year3", "curriculum_systems", "curriculum_ai"]
    examples: ["Veriden Öğrenme", "İşletim Sistemleri", "Bilgisayar Mimarisi"]
    tags: ["6. yarıyıl", "üçüncü sınıf", "makine öğrenmesi", "işletim sistemi"]

  - id: "curriculum_operating_systems_card"
    text: "BLG 312E; süreç, iş parçacığı, senkronizasyon, kilitlenme, CPU zamanlama, sanal bellek ve dosya sistemlerini işler. Resmî katalogda Unix sistem çağrılarıyla 3 programlama ödevi bulunur; teori doğrudan uygulamaya bağlanır."
    answer_card: true
    topics: ["curriculum_systems", "curriculum_projects", "academic_workload"]
    examples: ["Unix", "3 programlama ödevi", "sanal bellek"]
    source: "İTÜ ÖBS BLG 312E ders kataloğu"
    source_url: "https://obs.itu.edu.tr/public/DersKatalog/DersKatalogBilgiBransDersKodu?bransKodu=BLG&dersNo=312"
    tags: ["işletim sistemi", "ödev", "proje", "uygulamalı"]

  - id: "curriculum_semester7"
    text: "7. yarıyıl: Yazılım Mühendisliği, Yapay Zekâ, Bilgisayar Mühendisliği Tasarımı I, bir meslek tasarım ve bir İTÜ seçmeli; toplam 30 AKTS. BLG 411E grup projesiyle gereksinim, tasarım ve testi uygular."
    topics: ["curriculum_year4", "curriculum_ai", "curriculum_projects"]
    examples: ["Yapay Zekâ", "Tasarım I", "BLG 411E grup projesi"]
    source_urls:
      - "https://obs.itu.edu.tr/public/DersPlan/DersPlanDetay/2340"
      - "https://obs.itu.edu.tr/public/DersKatalog/DersKatalogBilgiBransDersKodu?bransKodu=BLG&dersNo=411"
    tags: ["7. yarıyıl", "dördüncü sınıf", "bitirme projesi", "yazılım mühendisliği"]

  - id: "curriculum_semester8"
    text: "8. yarıyıl: Bilgisayar Mühendisliği Tasarımı II, Ekonomi, ATA 122 ve iki meslek tasarım seçmelisi; toplam 30 AKTS. Tasarım II tek başına 12 AKTS ve haftada 1 teori+8 uygulama saatidir."
    topics: ["curriculum_year4", "curriculum_projects", "graduation"]
    examples: ["Tasarım II", "12 AKTS", "1+8 saat"]
    tags: ["8. yarıyıl", "dördüncü sınıf", "bitirme projesi", "capstone"]

  - id: "curriculum_ai_security_electives_card"
    text: "Güncel meslek seçmeli havuzunda Bilgisayarla Görme, Robotik, Bilgisayar Güvenliği, Güvenli Programlama, Ağ Güvenliği, AI Accelerators Lab ve AI Aided Computer Engineering var. Havuz 27 ders içerir; fiilî açılış dönem programına bağlıdır."
    answer_card: true
    topics: ["curriculum_ai", "curriculum_security", "specialization", "technical_resources"]
    examples: ["Bilgisayarla Görme", "Bilgisayar Güvenliği", "AI Accelerators Lab"]
    source: "İTÜ ÖBS güncel MT seçmeli grubu"
