    text: "Zorunlu çekirdekte BLG 102E C, BLG 223E ise C/C++ kullanır. Java ve Python bölüm çapında her öğrenciye zorunlu tek dil olarak tanımlanmıyor; seçilen ders, hoca ve projeye göre kullanılabilir. Yani C ve C++ kesin temel, Java/Python ise ders-proje yoluna göre değişir."
