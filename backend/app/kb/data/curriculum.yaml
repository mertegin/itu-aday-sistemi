    text: "Bizim programlama ve veri yapıları derslerinde sınavda kod okuma, kod yazma veya algoritma kurma soruları görebilirsin; format derse ve hocaya göre değişir. BLG 102E C, BLG 223E C/C++ ile uygulama hedefliyor; bölüm genelinde tek bir sınav formatı yok."
