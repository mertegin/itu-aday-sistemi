    label: "Algoritma dersinin yapısı"
    text: "Algoritma Analizi I kolay derslerden sayılmaz, ama düzenli problem çözerek yönetilebilir. BLG 335E asimptotik analiz, yinelemeler, sıralama ve ağaçları işliyor; resmî katalogda 3 proje var ve proje sorularından sınavlarda yararlanılabiliyor. Ezberden çok çözüm mantığı ve karmaşıklık analizi istiyor."
