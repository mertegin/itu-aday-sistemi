    tags: ["yapay zeka", "siber güvenlik", "seçmeli", "robotik", "bilgisayarlı görü"]

  - id: "curriculum_ai_aided_course"
    text: "2026'da eklenen BLG 483E, 14 haftada LLM ve prompt, üretken yapay zekâ, görsel/ses uygulamaları, AI destekli kodlama-test-hata ayıklama ve etiği kapsar; değerlendirme 4 ödev %40, ara sınav %20, final %40'tır."
    topics: ["curriculum_ai", "curriculum_projects", "specialization"]
    examples: ["BLG 483E", "LLM", "4 ödev", "%40"]
