    label: "Ders yükü ve çalışma düzeni"
    text: "Bizim müfredatımız her yarıyılı 30, mezuniyeti 240 AKTS tasarlar; algoritma, sistem ve laboratuvar dönemleri düzenli çalışma ister. İTÜ'de başarı bağıl değerlendirmeyle belirlenir; 2026 öğrenci deneyiminde sınavlar yoğunlaşsa da çoğu zaman yaklaşık 2 gün ara olur."
    answer_card: true
