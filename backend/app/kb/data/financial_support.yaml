  - id: "scholarship_combination_rule"
    text: "2025 İTÜ burs koşullarına göre birden fazla başarı bursuna hak kazanan öğrenciye yalnızca tutarı en yüksek olan burs verilir; başarı bursları öğrencinin yerleştirme puanı esas alınarak belirlenir."
    support_type: "condition"
    tags: ["birden fazla burs", "en yüksek burs", "yerleştirme puanı"]
