  - id: "scholarship_rank_501_1000"
    label: "501-1000 başarı ödülü"
    text: "2025 YKS'de Türkiye 501-1000 derecesinde olup bir İTÜ lisans programına 1. tercihiyle yerleşenlere hazırlık dahil 1+4 yıl boyunca yılda 9 ay aylık 6.750 TL, yani yılda toplam 60.750 TL başarı ödülü verilir. Bursun sürmesi için yıl sonu GNO en az 2,50 olmalı ve hazırlık ilk yılda başarıyla tamamlanmalıdır."
    rank_min: 501
    rank_max: 1000
