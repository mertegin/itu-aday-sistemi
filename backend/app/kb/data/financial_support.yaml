  - id: "scholarship_first_choice"
    label: "İlk tercih bursu"
    text: "2025 ilk tercih bursunda, tercih listesinde İTÜ'yü ilk sıraya yazıp bu tercihindeki bölüme yerleşenlere hazırlık dahil 1+4 yıl boyunca yılda 9 ay aylık 4.000 TL, öğle yemeği ve spor tesislerinden ücretsiz yararlanma desteği verilir. UOLP ve KKTC ortak programları kapsam dışıdır; devam koşulu GNO 2,50 ve hazırlık başarısıdır."
    requires_first_choice: true
    support_type: "first_choice"
    answer_card: true
    topics: ["campus"]
    tags: ["4000", "4.000", "ilk tercih bursu", "yemek bursu"]

  - id: "scholarship_need_based"
    label: "İhtiyaç bursu"
    text: "İTÜ'nün resmi burs sayfasına göre ekonomik gereksinimi olan öğrenciler nakdi ihtiyaç burslarından yararlanabilir; bu destekler İTÜ vakıfları, mezunları, dernekleri ve başka kişi veya kuruluşlarca karşılanır. Resmi sayfa sabit bir tutar ya da herkese burs garantisi belirtmez."
    support_type: "need_based"
    topics: ["financial_concern"]
    tags: ["ihtiyaç bursu", "ekonomik gereksinim", "nakdi burs", "para sıkıntısı"]

  - id: "scholarship_meal"
    label: "Yemek bursu"
    text: "İTÜ yemek bursu, üniversite yemekhanesinde günde bir öğün öğle yemeğini ücretsiz karşılar ve bir akademik yıl için geçerlidir."
    support_type: "meal"
    topics: ["financial_concern", "campus"]
    tags: ["yemek bursu", "ücretsiz öğle yemeği", "yemekhane"]

  - id: "scholarship_merit_benefits_1_100"
    text: "2025 başarı ödülünde Türkiye 1-100 derecesi için tek kişilik ücretsiz İTÜ yurdu, yılda 9 ay öğle yemeği, spor tesisleri, hazırlığı yurt dışında okuma imkanı ve İTÜ Teknopark'ta şirket açma önceliği listelenir. Bunlar kayıt ve başarı koşullarına bağlı imkanlardır; otomatik yatırım veya şirket başarısı garantisi değildir."
    rank_min: 1
    rank_max: 100
    support_type: "merit_benefits"
    topics: ["housing", "campus", "abroad", "entrepreneurship"]
    tags: ["ücretsiz yurt", "teknopark", "şirket açma önceliği"]

  - id: "scholarship_merit_benefits_101_500"
    text: "2025 başarı ödülünde Türkiye 101-500 derecesi için yılda 9 ay öğle yemeği, spor tesisleri, İTÜ Teknopark'ta şirket açma önceliği ve cinsiyete göre belirtilen ücretsiz yurt imkanları listelenir. Bunlar kayıt ve başarı koşullarına bağlıdır; otomatik yatırım veya şirket başarısı garantisi değildir."
    rank_min: 101
    rank_max: 500
    support_type: "merit_benefits"
    topics: ["housing", "campus", "entrepreneurship"]
    tags: ["ücretsiz yurt", "teknopark", "şirket açma önceliği"]

  - id: "scholarship_merit_benefits_501_1000"
    text: "2025 başarı ödülünde Türkiye 501-1000 derecesinde İTÜ'ye 1. tercihiyle yerleşenler için yılda 9 ay öğle yemeği, spor tesisleri, İTÜ Teknopark'ta şirket açma önceliği; kız öğrenciler için ücretsiz, erkek öğrenciler için üç kişilik standart yurtta yüzde 50 indirimli konaklama listelenir."
    rank_min: 501
