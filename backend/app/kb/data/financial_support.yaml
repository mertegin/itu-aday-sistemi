    label: "İlk 10 başarı ödülü"
    text: "2025 YKS'de Türkiye 1-10 derecesiyle bir İTÜ lisans programına kayıt yaptıranlara tek seferlik 100.000 TL başarı desteği; hazırlık dahil 1+4 yıl boyunca yılda 9 ay, resmi sayfada 'ayda 10.000 TL + 10.000 TL' olarak listelenen başarı ödülü verilir. Bursun sürmesi için yıl sonu GNO en az 2,50 olmalı ve hazırlık ilk yılda başarıyla tamamlanmalıdır."
