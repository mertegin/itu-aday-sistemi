  - id: "housing_capacity_fees_card"
    text: "İTÜ yurtları Ayazağa, Gümüşsuyu ve Tuzla'da toplam 5.300 yatak sunuyor. 2025-26 aylık ücretler oda tipine göre 1.720-13.500 TL; örneğin Ayazağa 3 kişilik kız odası 2.920 TL, Gölet normal oda 5.640 TL."
    answer_card: true
    topics: ["housing_details", "housing", "financial_concern"]
