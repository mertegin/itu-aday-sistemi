  - id: "department_clubs_teams_card"
    label: "Bölüm kulüpleri ve öğrenci takımları"
    text: "BBF'nin resmî sayfasında 5 bölüm kulübü sayılıyor: Yapay Zekâ, Blockchain Technologies, Oyun Tasarlama ve Geliştirme, İTÜ ACM ve GDG on Campus. Ayrıca W-TECH, DATABEES ve VCAMP adlı 3 öğrenci takımı tanıtılıyor."
