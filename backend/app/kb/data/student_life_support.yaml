  - id: "istanbul_transport_card"
    text: "Ayazağa Kampüsü M2 üzerindeki İTÜ-Ayazağa istasyonundadır; aynı hat Levent, Şişli-Mecidiyeköy ve Taksim'e bağlanır. Bu, Bilgisayar öğrencisinin kampüsten iş, etkinlik ve şehir merkezine aktarmasız kuzey-güney erişimini güçlendirir; süre saate göre değişir."
    answer_card: true
