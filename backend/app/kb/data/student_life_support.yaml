  - id: "housing_application_path_card"
    label: "Yeni öğrenciler için yurt başvurusu"
    text: "Yeni kayıtlı öğrenci, yerleştirmeden sonra İTÜ Yurt ve Burslar Ofisinin ilan ettiği tarihlerde çevrimiçi yurt sisteminden belgelerini yükleyerek başvurur; sonucu İTÜ Portal/yurt sistemi üzerinden izler. Yerleştirme tercih ve kontenjana bağlıdır, sonuç açıklanmadan garanti değildir. 2026 yeni kayıt takvimi yayımlandığında güncel tarih ayrıca kontrol edilmelidir."
    answer_card: true
    topics: ["housing_details", "housing", "financial_concern"]
    examples: ["çevrimiçi başvuru", "İTÜ Portal", "tercih ve kontenjan"]
    source: "İTÜ Yurt ve Burslar Ofisi yeni kayıt ve sonuç duyuruları"
    source_urls:
      - "https://yurtburs.itu.edu.tr/haberler/2025/08/25/2025-yks-ile-universitemizi-yeni-kazanan-ogrencilerimizin-dikkatine"
      - "https://yurtburs.itu.edu.tr/haberler/2025/09/16/2025-yks-yurt-basvuru-sonuclari-aciklandi"
    year: "2025 süreci; 2026 takvimi bekleniyor"
    tags: ["kalacak yerim yok", "nasıl ayarlarım", "yurt başvuru", "yurda nasıl başvurulur"]

  - id: "student_support_total_card"
    text: "İTÜ, 2025-26 döneminde öğrencilere burs, yemek ve barınma dahil toplam 408 milyon TL destek açıkladı; bu bireysel burs garantisi değil, destek ekosisteminin toplamıdır. Başarı, ihtiyaç, yemek ve yurt yolları ayrı koşullarla değerlendirilir."
    answer_card: true
    topics: ["financial_support", "housing_details", "student_wellbeing"]
    examples: ["408 milyon TL", "burs", "yemek", "barınma"]
    source: "İTÜ Yurt ve Burslar Ofisi"
    source_url: "https://yurtburs.itu.edu.tr/"
    tags: ["maddi destek", "toplam destek", "geçim", "burs"]

  - id: "psychological_support_card"
    text: "İTÜ PDR, öğrenci ve personele ücretsiz bireysel/grup danışmanlığı veriyor; merkez Ayazağa ve Maçka'da hizmet sunuyor. 2025 raporunda 934 öğrencinin hizmet için e-posta gönderdiği belirtiliyor; bu, desteğin fiilen kullanıldığını gösterir."
    answer_card: true
    topics: ["student_wellbeing"]
    examples: ["ücretsiz", "Ayazağa", "934 öğrenci"]
