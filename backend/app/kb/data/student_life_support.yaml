    text: "Mustafa İnan Kütüphanesi 7/24 açıktır ve İTÜ kütüphaneleri 1 milyondan fazla basılı+elektronik kaynağa erişim verir. Çalışma alanlarında 25 tek kişilik çalışma hücresi bulunur; grup odalarının bir bölümü lisansüstü/personel kullanımındadır."
    answer_card: true
