  - title: "SIRALAMA-BÖLÜM REHBERİ (Türkiye YKS 2025)"
    facts:
      - text: "İlk 1.000 SAY → İTÜ Bilgisayar için GÜVENLİ bölge (taban ~1.435; asla 'sınırda' deme, rahat girer)."
        source: "YÖK Atlas"
        year: 2025
        confidence: high
      - text: "1.000-1.435 SAY → İTÜ Bilgisayar ulaşılabilir; 1.300+ için 'geçen yıl tabanı buradaydı, yakın takip iyi olur' çerçevesi kullan."
        source: "YÖK Atlas"
        year: 2025
        confidence: high
      - text: "1.435-2.000 SAY → Bilgisayar geçen yıl tabanının GERİSİNDE (dürüst söyle); İTÜ YZ-Veri (~1.947) güçlü alternatif."
        source: "YÖK Atlas"
        year: 2025
        confidence: high
      - text: "2.000-5.000 SAY → İTÜ Elektronik-Haberleşme (~2.126), Uçak (~2.235), Matematik (~3.495), Endüstri (~3.723), Uzay (~3.988), Kontrol-Otomasyon (~4.486)."
        source: "YÖK Atlas"
        year: 2025
        confidence: high
      - text: "5.000-10.000 SAY → İTÜ Makine (~6.106), Elektrik (~6.124), Gemi/İnşaat/Kimya bandı."
        source: "YÖK Atlas"
        year: 2025
        confidence: high
      - text: "TIP: en seçici devlet tıpları ~5.000-15.000 SAY (Cerrahpaşa/Hacettepe/İstanbul Tıp bu aralıkta); orta tıplar 20.000-50.000 SAY. 1.000-2.000 sıralaması TIP için FAZLASIYLA yeterli — o sıralamada aday zaten tıp kazanır. Sıralaması iyi bir aday 'tıp mı mühendislik mi' ikilemi yaşıyorsa bu ALAN tercihi ikilemidir, 'puan yetip yetmemesi' değil."
        source: "YÖK Atlas"
        year: 2025
        confidence: high
      - text: "Sıralamayı yorumlarken küçük sayı = daha üstün. 1.000 < 5.000; 1.000 daha iyi."
        source: "tanım"
        year: 2025
        confidence: high
      - text: "TERCİH LİSTESİ STRATEJİSİ: YKS yerleştirme sisteminde en çok istediğin bölümü üst sıraya yazmak kaybettirmez — yerleştirme tercih sırana ve puanına göre yapılır, 'tutmayan üst tercih' alt tercihlerini etkilemez. Bu yüzden İTÜ Bilgisayar'ı istiyorsan listenin en üstüne yazması risksizdir; altına sıralamana uygun güvenli seçenekler eklenir. Kesin liste tavsiyesi verme, bu genel kuralı anlat ve rehber öğretmene danışmasını öner."
        source: "ÖSYM yerleştirme kuralı — genel bilgi"
        year: 2025
        confidence: high

