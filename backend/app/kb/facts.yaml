  - title: "YAZILIM MÜH. vs BİLGİSAYAR MÜH. (sık soru)"
    topics: ["curriculum", "software_vs_compe"]
    facts:
      - text: "İTÜ'de lisans düzeyinde ayrı bir 'Yazılım Mühendisliği' bölümü YOK — yazılım eğitimi Bilgisayar Mühendisliği çekirdeğinin içindedir (Software Engineering dersi + Data Structures, Algorithms, Database, OS + yazılım ağırlıklı teknik seçmeliler)."
        source: "İTÜ müfredat"
        year: 2025
        confidence: high
      - text: "Kavramsal fark: Yazılım Müh. programları yazılım geliştirme yaşam döngüsüne odaklanır (gereksinim, tasarım, test, bakım, proje yönetimi); Bilgisayar Müh. bunun üstüne donanım, bilgisayar mimarisi, işletim sistemleri, ağlar ve algoritma teorisini ekleyen daha geniş bir temel verir."
        source: "genel bilgi"
        year: 2025
        confidence: high
      - text: "Türkiye'de Yazılım Müh. lisansı daha çok bazı vakıf ve yeni devlet programlarında var; sektörde her iki bölümün mezunu da 'yazılım mühendisi' rollerinde çalışır — işe alımda bölüm adından çok beceri ve portfolyo belirleyicidir."
        source: "genel bilgi"
        year: 2025
        confidence: medium

