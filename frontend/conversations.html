<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geçmiş Sohbetler — İTÜ Aday Sistemi</title>
    <link rel="stylesheet" href="style.css?v=3">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        body { background: var(--gray-100); }
        .conv-app {
            display: grid;
            grid-template-columns: 380px 1fr;
            height: 100vh;
        }

        /* SOL: SESSION LİSTESİ */
        .conv-list-pane {
            background: white;
            border-right: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .conv-list-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .conv-list-header h2 { font-size: 16px; font-weight: 700; color: var(--gray-900); }
        .conv-list-header a { font-size: 12.5px; color: var(--itu-blue); text-decoration: none; }
        .conv-list-header a:hover { text-decoration: underline; }
        .conv-count { font-size: 12px; color: var(--gray-500); padding: 8px 20px; background: var(--gray-50); border-bottom: 1px solid var(--gray-100); }
        .conv-list { flex: 1; overflow-y: auto; }
        .conv-item {
            padding: 14px 20px;
            border-bottom: 1px solid var(--gray-100);
            cursor: pointer;
            transition: background 0.1s ease;
        }
        .conv-item:hover { background: var(--gray-50); }
        .conv-item.active { background: var(--itu-blue-soft); border-left: 3px solid var(--itu-blue); padding-left: 17px; }
        .conv-item .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .conv-item .name { font-weight: 600; font-size: 13.5px; color: var(--gray-900); }
        .conv-item .sid { font-family: ui-monospace, monospace; font-size: 10px; color: var(--gray-400); }
        .conv-item .preview {
            font-size: 12px;
            color: var(--gray-500);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }
        .conv-item .meta-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .conv-item .tag {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 4px;
            background: var(--gray-100);
            color: var(--gray-600);
            font-family: ui-monospace, monospace;
        }
        .conv-item .tag.rank { background: #fef3c7; color: #92400e; }
        .conv-item .tag.state { background: #ecfeff; color: #0e7490; }

        /* SAĞ: SOHBET DETAYI */
        .conv-detail {
            overflow-y: auto;
            padding: 24px 32px;
        }
        .conv-detail .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--gray-400);
            font-size: 14px;
        }
        .detail-header {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 18px;
            box-shadow: var(--shadow-sm);
        }
        .detail-header h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
        .detail-header .info-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--gray-600); }
        .detail-header .info-row b { color: var(--gray-900); }
        .detail-header .actions-row { margin-top: 10px; display: flex; gap: 8px; }
        .detail-header .actions-row a, .detail-header .actions-row button {
            font-size: 12px; padding: 6px 12px; border-radius: 6px;
            border: 1px solid var(--gray-200); background: white;
            color: var(--itu-blue); text-decoration: none; cursor: pointer; font-family: inherit;
        }
        .detail-header .actions-row a:hover, .detail-header .actions-row button:hover { background: var(--gray-50); }

        .turn-block { margin-bottom: 4px; }
        .conv-msg {
            max-width: 72%;
            padding: 10px 14px;
            border-radius: var(--radius-lg);
            font-size: 13.5px;
            line-height: 1.55;
            margin-bottom: 6px;
            box-shadow: var(--shadow-sm);
        }
        .conv-msg.user {
            margin-left: auto;
            background: var(--itu-navy);
            color: white;
            border-bottom-right-radius: 6px;
        }
        .conv-msg.assistant {
            background: white;
            border: 1px solid var(--gray-200);
            border-bottom-left-radius: 6px;
        }
        .turn-meta {
            font-size: 10.5px;
            color: var(--gray-400);
            font-family: ui-monospace, monospace;
            margin: 2px 0 14px 4px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .turn-meta .tm {
            background: var(--gray-100);
            padding: 2px 7px;
            border-radius: 4px;
        }
        .turn-meta .tm.arg { background: #f5f3ff; color: #6d28d9; }
        .turn-meta .tm.fsm { background: #ecfeff; color: #0e7490; }
        .turn-meta .tm.reward { background: #f0fdf4; color: #15803d; }
    </style>
</head>
<body>
    <div class="conv-app">
        <aside class="conv-list-pane">
            <div class="conv-list-header">
                <h2>Geçmiş Sohbetler</h2>
                <a href="/">← Chat'e dön</a>
            </div>
            <div class="conv-count" id="convCount">Yükleniyor…</div>
            <div class="conv-list" id="convList"></div>
        </aside>

        <main class="conv-detail" id="convDetail">
            <div class="placeholder">Soldan bir sohbet seç — mesajlar ve her turnun kararları burada görünecek.</div>
        </main>
    </div>

    <script>
        const API_BASE = window.location.origin + "/api";
        let activeSid = null;

        const STAGE_TR = {
            S0_FALLBACK: "Toparlanma", S1_GREETING: "Karşılama",
            S2_INDECISION_PROBE: "Tanıma", S2R_PROFILE_UPDATE: "Profil güncelleme",
            S3_ARGUMENT_SELECTION: "Strateji", S4_ARGUMENT_DELIVERY: "Öneri",
            S5_RECEPTION_EVAL: "Tepki değ.", S6_RAG_DEEP_DIVE: "Detay",
            S7_CONCERN_HANDLING: "Endişe", S8_IDEAL_MATCH_SUMMARY: "Özet", S9_CLOSING: "Kapanış",
        };

        function esc(s) {
            return String(s ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        async function loadList() {
            const res = await fetch(`${API_BASE}/sessions`);
            const data = await res.json();
            document.getElementById("convCount").textContent =
                `${data.total} sohbet (en yeni üstte)`;
            const list = document.getElementById("convList");
            list.innerHTML = data.sessions.map(s => `
                <div class="conv-item" data-sid="${esc(s.session_id)}">
                    <div class="top-row">
                        <span class="name">${esc(s.display_name || "(isimsiz aday)")}</span>
                        <span class="sid">${esc(s.session_id.slice(-6))}</span>
                    </div>
                    <div class="preview">${esc(s.last_user_message || "—")}</div>
                    <div class="meta-row">
                        <span class="tag">${s.turn_count} tur</span>
                        ${s.yks_rank ? `<span class="tag rank">sıra ${s.yks_rank}</span>` : ""}
                        <span class="tag state">${esc(STAGE_TR[s.fsm_state] || s.fsm_state)}</span>
                        ${s.created_at ? `<span class="tag">${new Date(s.created_at).toLocaleString("tr-TR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"})}</span>` : ""}
                    </div>
                </div>
            `).join("") || '<div style="padding:20px;color:var(--gray-400);font-size:13px">Henüz sohbet yok.</div>';
        }

        async function loadDetail(sid) {
            activeSid = sid;
            document.querySelectorAll(".conv-item").forEach(el =>
                el.classList.toggle("active", el.dataset.sid === sid));

            const res = await fetch(`${API_BASE}/session/${sid}`);
            if (!res.ok) return;
            const data = await res.json();

            // Mesajları turn'lere grupla: user+assistant çiftleri, log'larla eşleştir
            const logByTurn = {};
            (data.strategy_logs || []).forEach(l => logByTurn[l.turn] = l);

            let turnNo = 0;
            let html = "";
            const p = data.profile || {};
            const ind = p.indecision || {};

            html += `
            <div class="detail-header">
                <h3>${esc(data.display_name || "(isimsiz aday)")} · <span style="font-family:monospace;font-size:12px;color:var(--gray-400)">${esc(sid)}</span></h3>
                <div class="info-row">
                    <span>Tur: <b>${data.turn_count}</b></span>
                    <span>Aşama: <b>${esc(STAGE_TR[data.fsm_state] || data.fsm_state)}</b></span>
                    ${p.yks_rank ? `<span>YKS: <b>${p.yks_rank}</b></span>` : ""}
                    ${ind.target_department ? `<span>Hedef: <b>${esc(ind.target_department)}</b></span>` : ""}
                    ${(ind.department_alternatives || []).length ? `<span>Bölüm alt: <b>${esc(ind.department_alternatives.join(", "))}</b></span>` : ""}
                    ${(ind.university_alternatives || []).length ? `<span>Üniv alt: <b>${esc(ind.university_alternatives.join(", "))}</b></span>` : ""}
                    ${(p.concerns || []).length ? `<span>Kaygılar: <b>${esc(p.concerns.join(", "))}</b></span>` : ""}
                </div>
                <div class="actions-row">
                    <a href="/fsm.html?session=${esc(sid)}" target="_blank">FSM yolunu gör →</a>
                    <button onclick="exportMd()">↓ Markdown indir</button>
                </div>
            </div>`;

            (data.messages || []).forEach(m => {
                if (m.role === "user") {
                    turnNo += 1;
                    html += `<div class="turn-block"><div class="conv-msg user">${esc(m.text)}</div>`;
                } else {
                    html += `<div class="conv-msg assistant">${esc(m.text)}</div>`;
                    const log = logByTurn[turnNo];
                    if (log) {
                        html += `<div class="turn-meta">
                            <span class="tm">T${turnNo}</span>
                            <span class="tm arg">${esc(log.argument_id || "-")}</span>
                            <span class="tm fsm">${esc(log.fsm_from)} → ${esc(log.fsm_to)}</span>
                            ${log.reward != null ? `<span class="tm reward">önceki tur ödülü ${log.reward.toFixed(2)}</span>` : ""}
                        </div>`;
                    }
                    html += `</div>`;
                }
            });

            window._detailData = data;
            document.getElementById("convDetail").innerHTML = html;
            document.getElementById("convDetail").scrollTop = 0;
        }

        function exportMd() {
            const data = window._detailData;
            if (!data) return;
            const lines = [`# Sohbet — ${data.session_id}`, ""];
            lines.push(`- Aday: ${data.display_name || "(isimsiz)"}`);
            lines.push(`- Tur: ${data.turn_count} · Aşama: ${data.fsm_state}`);
            lines.push("");
            const logByTurn = {};
            (data.strategy_logs || []).forEach(l => logByTurn[l.turn] = l);
            let t = 0;
            (data.messages || []).forEach(m => {
                if (m.role === "user") { t += 1; lines.push(`**🧑 Aday (T${t}):** ${m.text}`); }
                else {
                    lines.push(`**🤖 Neco:** ${m.text}`);
                    const log = logByTurn[t];
                    if (log) lines.push(`> arg: \`${log.argument_id}\` · fsm: \`${log.fsm_from} → ${log.fsm_to}\`` + (log.reward != null ? ` · ödül: ${log.reward.toFixed(2)}` : ""));
                }
                lines.push("");
            });
            const blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `sohbet_${data.session_id}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById("convList").addEventListener("click", (e) => {
            const item = e.target.closest(".conv-item");
            if (item && item.dataset.sid) loadDetail(item.dataset.sid);
        });

        loadList();
        // URL'de ?session= varsa direkt aç
        const qsid = new URLSearchParams(window.location.search).get("session");
        if (qsid) setTimeout(() => loadDetail(qsid), 300);
    </script>
</body>
</html>
