<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geçmiş Sohbetler — İTÜ Aday Sistemi</title>
    <link rel="stylesheet" href="style.css?v=10">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        .conv-app {
            display: grid;
            grid-template-columns: 360px 1fr;
            height: calc(100vh - 60px);
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* SOL: LİSTE */
        .conv-list-pane {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .conv-list-header {
            padding: 16px 20px 12px;
            border-bottom: 1px solid var(--border);
        }
        .conv-list-header h2 { font-size: 15px; font-weight: 700; }
        .conv-list-header .count { font-size: 12px; color: var(--text-3); margin-top: 3px; }
        .conv-list { flex: 1; overflow-y: auto; padding: 8px; }
        .conv-item {
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.12s ease;
            border: 1px solid transparent;
        }
        .conv-item:hover { background: var(--surface-2); }
        .conv-item.active {
            background: var(--primary-soft);
            border-color: #cfdffc;
        }
        .conv-item .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }
        .conv-item .name { font-weight: 700; font-size: 13.5px; }
        .conv-item .sid { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
        .conv-item .preview {
            font-size: 12px;
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 7px;
        }
        .conv-item .meta-row { display: flex; gap: 5px; flex-wrap: wrap; }

        /* SAĞ: DETAY */
        .conv-detail {
            overflow-y: auto;
            padding-right: 4px;
        }
        .conv-detail .placeholder {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-3);
            font-size: 14px;
        }
        .conv-detail .placeholder .big { font-size: 40px; }

        .detail-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 18px 22px;
            margin-bottom: 16px;
        }
        .detail-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
        .detail-card h3 .sid { font-family: var(--mono); font-size: 11px; color: var(--text-3); font-weight: 500; }
        .detail-card .info-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .detail-card .actions-row { margin-top: 12px; display: flex; gap: 8px; }
        .detail-card .actions-row a { text-decoration: none; display: inline-block; }

        .fsm-card-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        /* Transcript */
        .transcript {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 4px 2px 24px;
        }
        .conv-msg {
            max-width: 72%;
            padding: 11px 15px;
            border-radius: 18px;
            font-size: 13.5px;
            line-height: 1.6;
        }
        .conv-msg.user {
            align-self: flex-end;
            background: var(--primary-grad);
            color: #fff;
            border-bottom-right-radius: 6px;
            box-shadow: 0 3px 10px rgba(29, 91, 216, 0.22);
        }
        .conv-msg.assistant {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 6px;
            box-shadow: var(--shadow-sm);
        }
        .turn-label {
            align-self: flex-end;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-3);
            margin-bottom: -6px;
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <a class="brand" href="/">
            <span class="brand-badge">N</span>
            İTÜ Aday Sistemi
        </a>
        <div class="nav-links">
            <a href="/">Sohbet</a>
            <a href="/conversations.html" class="active">Geçmiş Sohbetler</a>
            <a href="/fsm.html">FSM Haritası</a>
        </div>
    </nav>

    <div class="conv-app">
        <aside class="conv-list-pane">
            <div class="conv-list-header">
                <h2>Geçmiş Sohbetler</h2>
                <div class="count" id="convCount">Yükleniyor…</div>
            </div>
            <div class="conv-list" id="convList"></div>
        </aside>

        <main class="conv-detail" id="convDetail">
            <div class="placeholder">
                <div class="big">💬</div>
                <div>Soldan bir sohbet seç — konuşma ve FSM yolu burada görünecek.</div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = window.location.origin + "/api";
        let activeSid = null;

        const STAGE_TR = {
            S0_FALLBACK: "Toparlanma", S1_GREETING: "Karşılama",
            S2_INDECISION_PROBE: "Adayı tanıma", S2R_PROFILE_UPDATE: "Profil güncelleme",
            S3_ARGUMENT_SELECTION: "Strateji seçimi", S4_ARGUMENT_DELIVERY: "Öneri sunumu",
            S5_RECEPTION_EVAL: "Tepki değerlendirme", S6_RAG_DEEP_DIVE: "Detay bilgi",
            S7_CONCERN_HANDLING: "Endişe yönetimi", S8_IDEAL_MATCH_SUMMARY: "İdeal tercih özeti",
            S9_CLOSING: "Kapanış",
        };

        function esc(s) {
            return String(s ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        function stageTr(s) { return STAGE_TR[s] || s; }

        async function loadList() {
            const res = await fetch(`${API_BASE}/sessions`);
            const data = await res.json();
            document.getElementById("convCount").textContent =
                `${data.total} sohbet · en yeni üstte`;
            const list = document.getElementById("convList");
            list.innerHTML = data.sessions.map(s => `
                <div class="conv-item" data-sid="${esc(s.session_id)}">
                    <div class="top-row">
                        <span class="name">${esc(s.display_name || "(isimsiz aday)")}</span>
                        <span class="sid">${esc(s.session_id.slice(-6))}</span>
                    </div>
                    <div class="preview">${esc(s.last_user_message || "—")}</div>
                    <div class="meta-row">
                        <span class="tag">${s.turn_count} tur</span>
                        ${s.yks_rank ? `<span class="tag rank">sıra ${s.yks_rank}</span>` : ""}
                        <span class="tag state">${esc(stageTr(s.fsm_state))}</span>
                        ${s.created_at ? `<span class="tag">${new Date(s.created_at).toLocaleString("tr-TR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"})}</span>` : ""}
                    </div>
                </div>
            `).join("") || '<div style="padding:20px;color:var(--text-3);font-size:13px">Henüz sohbet yok.</div>';

            // Aktifse işaretle (geri dönüşlerde)
            if (activeSid) {
                document.querySelectorAll(".conv-item").forEach(el =>
                    el.classList.toggle("active", el.dataset.sid === activeSid));
            }
        }

        // Konuşmanın FSM yolunu üstte yatay şerit olarak çiz
        function renderFsmPath(logs) {
            if (!logs || logs.length === 0) return "";
            const parts = [];
            parts.push(`<span class="node start">${esc(stageTr(logs[0].fsm_from))}</span>`);
            logs.forEach((l, i) => {
                const isLast = i === logs.length - 1;
                parts.push(`<span class="arrow">→</span>`);
                parts.push(
                    `<span class="node ${isLast ? "last" : ""}" title="${esc(l.fsm_from)} → ${esc(l.fsm_to)}">` +
                    `<em>T${l.turn}</em> ${esc(stageTr(l.fsm_to))}</span>`
                );
            });
            return `
                <div class="detail-card">
                    <div class="fsm-card-title">Bu konuşmanın FSM yolu</div>
                    <div class="fsm-path">${parts.join("")}</div>
                </div>`;
        }

        async function loadDetail(sid) {
            activeSid = sid;
            document.querySelectorAll(".conv-item").forEach(el =>
                el.classList.toggle("active", el.dataset.sid === sid));

            const res = await fetch(`${API_BASE}/session/${sid}`);
            if (!res.ok) return;
            const data = await res.json();

            const p = data.profile || {};
            const ind = p.indecision || {};

            let html = `
            <div class="detail-card">
                <h3>${esc(data.display_name || "(isimsiz aday)")} <span class="sid">${esc(sid)}</span></h3>
                <div class="info-row">
                    <span class="tag">${data.turn_count} tur</span>
                    <span class="tag state">${esc(stageTr(data.fsm_state))}</span>
                    ${p.yks_rank ? `<span class="tag rank">YKS ${p.yks_rank}</span>` : ""}
                    ${ind.target_department ? `<span class="tag">hedef: ${esc(ind.target_department)}</span>` : ""}
                    ${(ind.university_alternatives || []).length ? `<span class="tag">alternatif: ${esc(ind.university_alternatives.join(", "))}</span>` : ""}
                </div>
                <div class="actions-row">
                    <a class="btn btn-ghost" href="/fsm.html?session=${esc(sid)}">Haritada gör</a>
                    <button class="btn btn-ghost" onclick="exportMd()">↓ İndir (.md)</button>
                </div>
            </div>`;

            html += renderFsmPath(data.strategy_logs || []);

            html += '<div class="transcript">';
            let turnNo = 0;
            (data.messages || []).forEach(m => {
                if (m.role === "user") {
                    turnNo += 1;
                    html += `<div class="turn-label">T${turnNo}</div>`;
                    html += `<div class="conv-msg user">${esc(m.text)}</div>`;
                } else {
                    html += `<div class="conv-msg assistant">${esc(m.text)}</div>`;
                }
            });
            html += "</div>";

            window._detailData = data;
            const detail = document.getElementById("convDetail");
            detail.innerHTML = html;
            detail.scrollTop = 0;
        }

        function exportMd() {
            const data = window._detailData;
            if (!data) return;
            const lines = [`# Sohbet — ${data.session_id}`, ""];
            lines.push(`- Aday: ${data.display_name || "(isimsiz)"}`);
            lines.push(`- Tur: ${data.turn_count} · Aşama: ${data.fsm_state}`);
            lines.push("");
            let t = 0;
            (data.messages || []).forEach(m => {
                if (m.role === "user") { t += 1; lines.push(`**Aday (T${t}):** ${m.text}`); }
                else lines.push(`**Neco:** ${m.text}`);
                lines.push("");
            });
            const blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `sohbet_${data.session_id}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById("convList").addEventListener("click", (e) => {
            const item = e.target.closest(".conv-item");
            if (item && item.dataset.sid) loadDetail(item.dataset.sid);
        });

        loadList();
        // URL'de ?session= varsa direkt aç
        const qsid = new URLSearchParams(window.location.search).get("session");
        if (qsid) setTimeout(() => loadDetail(qsid), 300);
    </script>
</body>
</html>
