<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İTÜ Aday Sistemi — Sohbet</title>
    <link rel="stylesheet" href="style.css?v=10">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <nav class="topbar">
        <a class="brand" href="/">
            <span class="brand-badge">N</span>
            İTÜ Aday Sistemi
        </a>
        <div class="nav-links">
            <a href="/" class="active">Sohbet</a>
            <a href="/conversations.html">Geçmiş Sohbetler</a>
            <a href="/fsm.html">FSM Haritası</a>
        </div>
    </nav>

    <main class="chat-shell">
        <div class="chat-card">
            <header class="chat-head">
                <div class="bot-id">
                    <div class="avatar">N</div>
                    <div>
                        <div class="title">Neco</div>
                        <div class="sub">İTÜ Bilgisayar Mühendisliği tercih danışmanı</div>
                    </div>
                </div>
                <div class="head-right">
                    <span id="stageBadge" class="stage-chip">Karşılama</span>
                    <button id="newSessionBtn" class="btn btn-primary">+ Yeni sohbet</button>
                </div>
            </header>

            <div id="messages" class="messages"></div>

            <form id="chatForm" class="composer">
                <input type="text" id="messageInput" placeholder="Mesajınızı yazın…" autocomplete="off" autofocus>
                <button type="submit">Gönder</button>
            </form>

            <div class="session-line">
                Oturum: <code id="sessionId" title="Kopyalamak için tıkla">—</code>
            </div>
        </div>
    </main>

    <script src="app.js?v=10"></script>
</body>
</html>
