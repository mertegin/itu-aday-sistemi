<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandit İstatistikleri — İTÜ Aday Sistemi</title>
    <link rel="stylesheet" href="style.css?v=3">
    <style>
        body { background: var(--gray-100); padding: 32px; }
        .stats-container { max-width: 1000px; margin: 0 auto; }
        .stats-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
        }
        .stats-header h1 { font-size: 22px; font-weight: 700; color: var(--gray-900); }
        .stats-header a { color: var(--itu-blue); text-decoration: none; font-size: 13px; }
        .stats-header a:hover { text-decoration: underline; }
        .summary-row { display: flex; gap: 14px; margin-bottom: 24px; }
        .summary-card {
            flex: 1; background: white; border: 1px solid var(--gray-200);
            border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm);
        }
        .summary-card .num { font-size: 28px; font-weight: 700; color: var(--itu-navy); }
        .summary-card .lbl { font-size: 12px; color: var(--gray-500); margin-top: 4px; }

        table {
            width: 100%; border-collapse: collapse; background: white;
            border-radius: var(--radius); overflow: hidden;
            box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200);
        }
        th {
            text-align: left; padding: 12px 16px; background: var(--itu-navy);
            color: white; font-size: 11.5px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        td { padding: 11px 16px; border-top: 1px solid var(--gray-100); font-size: 13px; }
        td code {
            font-family: ui-monospace, "SF Mono", monospace; font-size: 12px;
            background: var(--gray-100); padding: 2px 7px; border-radius: 4px; color: var(--itu-accent);
        }
        .bar-cell { min-width: 160px; }
        .bar-track { background: var(--gray-100); border-radius: 999px; height: 8px; position: relative; }
        .bar-fill { background: linear-gradient(90deg, var(--itu-blue), #60a5fa); border-radius: 999px; height: 8px; }
        .bar-fill.reward { background: linear-gradient(90deg, #16a34a, #4ade80); }
        .num-label { font-size: 11px; color: var(--gray-500); margin-top: 3px; }
        .ut-details { font-size: 11px; color: var(--gray-500); }
        .ut-details span { display: inline-block; margin-right: 10px; }
        tr:hover td { background: var(--gray-50); }
        .empty-note { text-align: center; padding: 48px; color: var(--gray-400); }
    </style>
</head>
<body>
    <div class="stats-container">
        <div class="stats-header">
            <h1>Bandit İstatistikleri</h1>
            <div>
                <a href="/">← Chat'e dön</a> &nbsp;·&nbsp;
                <a href="#" onclick="loadStats(); return false;">↻ Yenile</a>
            </div>
        </div>

        <div class="summary-row">
            <div class="summary-card">
                <div class="num" id="totalTurns">—</div>
                <div class="lbl">Toplam turn (tüm session'lar)</div>
            </div>
            <div class="summary-card">
                <div class="num" id="totalArgs">—</div>
                <div class="lbl">Kullanılan farklı argüman</div>
            </div>
            <div class="summary-card">
                <div class="num" id="bestArg">—</div>
                <div class="lbl">En yüksek ort. ödüllü argüman</div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Argüman</th>
                    <th class="bar-cell">Seçilme</th>
                    <th class="bar-cell">Ort. Ödül</th>
                    <th>User Type Kırılımı</th>
                </tr>
            </thead>
            <tbody id="statsBody">
                <tr><td colspan="4" class="empty-note">Yükleniyor…</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_BASE = window.location.origin + "/api";

        async function loadStats() {
            const res = await fetch(`${API_BASE}/bandit/stats`);
            const data = await res.json();
            const args = data.arguments || [];

            document.getElementById("totalTurns").textContent = data.total_turns;
            document.getElementById("totalArgs").textContent = args.length;

            const withReward = args.filter(a => a.avg_reward !== null && a.reward_samples >= 2);
            const best = withReward.sort((a, b) => b.avg_reward - a.avg_reward)[0];
            document.getElementById("bestArg").textContent = best ? best.argument_id : "—";

            const body = document.getElementById("statsBody");
            if (args.length === 0) {
                body.innerHTML = '<tr><td colspan="4" class="empty-note">Henüz veri yok — birkaç konuşma yapın.</td></tr>';
                return;
            }

            const maxCount = Math.max(...args.map(a => a.selected_count));
            body.innerHTML = args.map(a => {
                const countPct = (a.selected_count / maxCount * 100).toFixed(0);
                const rewardPct = a.avg_reward !== null ? (a.avg_reward * 100).toFixed(0) : 0;
                const utStr = Object.entries(a.by_user_type)
                    .sort((x, y) => y[1].count - x[1].count)
                    .slice(0, 4)
                    .map(([ut, v]) => `<span>${ut}: ${v.count}×${v.avg_reward !== null ? ` (r=${v.avg_reward})` : ""}</span>`)
                    .join("");
                return `
                <tr>
                    <td><code>${a.argument_id}</code></td>
                    <td class="bar-cell">
                        <div class="bar-track"><div class="bar-fill" style="width:${countPct}%"></div></div>
                        <div class="num-label">${a.selected_count} kez</div>
                    </td>
                    <td class="bar-cell">
                        <div class="bar-track"><div class="bar-fill reward" style="width:${rewardPct}%"></div></div>
                        <div class="num-label">${a.avg_reward !== null ? a.avg_reward.toFixed(3) + ` (${a.reward_samples} örnek)` : "veri yok"}</div>
                    </td>
                    <td class="ut-details">${utStr || "—"}</td>
                </tr>`;
            }).join("");
        }

        loadStats();
    </script>
</body>
</html>
